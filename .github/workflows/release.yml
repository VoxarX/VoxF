name: Build and release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: voxf
            artifact: voxf-linux-x86_64
          - os: windows-latest
            bin: voxf.exe
            artifact: voxf-windows-x86_64.exe
          - os: macos-latest
            bin: voxf
            artifact: voxf-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --verbose

      - name: Build
        run: cargo build --release --verbose

      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ steps.sha.outputs.short }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
